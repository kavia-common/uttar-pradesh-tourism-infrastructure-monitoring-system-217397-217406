# server and management
server.port=${SERVER_PORT:8080}
management.server.port=${MANAGEMENT_PORT:${SERVER_PORT:8080}}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# datasource - PostgreSQL (use environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upstdc}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Multipart upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
# Threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=1MB

# CORS (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# uploads
# Base directory for file uploads; can be overridden with env var UPLOADS_DIR
file.upload-dir=${UPLOADS_DIR:${PWD}/uploads}

# logging
logging.config=classpath:logback.xml

# JWT security configuration (use environment variables in production)
# 256-bit base64 secret recommended (e.g., `openssl rand -base64 32`)
APP_JWT_SECRET=${APP_JWT_SECRET:dev-secret-change-me}
APP_JWT_EXPIRATION_MS=${APP_JWT_EXPIRATION_MS:3600000}               # 60 minutes
APP_JWT_REFRESH_EXPIRATION_MS=${APP_JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14 days

# Geo/Reverse-Geocoding (optional)
# Set GEO_REVERSE_ENABLED=true and provide GEO_API_KEY to enable reverse geocoding in GeoService
GEO_REVERSE_ENABLED=${GEO_REVERSE_ENABLED:false}
GEO_API_KEY=${GEO_API_KEY:}
